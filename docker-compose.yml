services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: chainvigil-web
    profiles: ["app"]
    environment:
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: chainvigil-admin
    profiles: ["app"]
    environment:
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://api:4000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chainvigil-api
    profiles: ["app"]
    environment:
      APP_BASE_URL: http://localhost:3000
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chainvigil_ai
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: chainvigil-bot
    profiles: ["app"]
    environment:
      APP_BASE_URL: http://localhost:3000
      BOT_PORT: 4001
      TELEGRAM_BOT_TOKEN: mock-local-token
    ports:
      - "4001:4001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: chainvigil-worker
    profiles: ["app"]
    environment:
      CHAINVIGIL_RUNTIME_MODE: mock
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chainvigil_ai
      REDIS_URL: redis://redis:6379
      WORKER_HEARTBEAT_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: chainvigil-postgres
    environment:
      POSTGRES_DB: chainvigil_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - chainvigil-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chainvigil_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chainvigil-redis
    ports:
      - "6379:6379"
    volumes:
      - chainvigil-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chainvigil-postgres-data:
  chainvigil-redis-data:
