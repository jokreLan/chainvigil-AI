services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_BASE_URL: ${NEXT_PUBLIC_APP_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    container_name: chainvigil-web
    profiles: ["app"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_APP_BASE_URL: ${NEXT_PUBLIC_APP_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      INTERNAL_WRITE_SECRET: ${INTERNAL_WRITE_SECRET:-local-dev-write-secret-32}
      CHAINVIGIL_RUNTIME_MODE: ${CHAINVIGIL_RUNTIME_MODE:-mock}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: chainvigil-admin
    profiles: ["app"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: http://api:4000
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:3001}
      ADMIN_BASIC_AUTH_USERNAME: ${ADMIN_BASIC_AUTH_USERNAME:-admin}
      ADMIN_BASIC_AUTH_PASSWORD: ${ADMIN_BASIC_AUTH_PASSWORD:?Set ADMIN_BASIC_AUTH_PASSWORD before starting admin}
      CHAINVIGIL_RUNTIME_MODE: ${CHAINVIGIL_RUNTIME_MODE:-mock}
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chainvigil-api
    profiles: ["app"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_BASE_URL: ${NEXT_PUBLIC_APP_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      API_BASE_URL: ${API_BASE_URL:-https://api.chainvigil.ai}
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/chainvigil_ai
      REDIS_URL: redis://redis:6379
      INTERNAL_WRITE_SECRET: ${INTERNAL_WRITE_SECRET:-local-dev-write-secret-32}
      ADMIN_BASIC_AUTH_USERNAME: ${ADMIN_BASIC_AUTH_USERNAME:-admin}
      ADMIN_BASIC_AUTH_PASSWORD: ${ADMIN_BASIC_AUTH_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      TRUST_PROXY: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GOPLUS_API_KEY: ${GOPLUS_API_KEY:-}
      HONEYPOT_API_KEY: ${HONEYPOT_API_KEY:-}
      RPC_SOLANA_URL: ${RPC_SOLANA_URL:-}
      RPC_BSC_URL: ${RPC_BSC_URL:-}
      CHAINVIGIL_LIVE_PROVIDERS: ${CHAINVIGIL_LIVE_PROVIDERS:-false}
      CHAINVIGIL_RUNTIME_MODE: ${CHAINVIGIL_RUNTIME_MODE:-mock}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: chainvigil-bot
    profiles: ["app"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: http://api:4000
      BOT_PORT: 4001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-local-dev-telegram-webhook}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"
      CHAINVIGIL_RUNTIME_MODE: ${CHAINVIGIL_RUNTIME_MODE:-mock}
    ports:
      - "4001:4001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: chainvigil-worker
    profiles: ["app"]
    environment:
      CHAINVIGIL_RUNTIME_MODE: ${CHAINVIGIL_RUNTIME_MODE:-mock}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/chainvigil_ai
      REDIS_URL: redis://redis:6379
      WORKER_HEARTBEAT_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: chainvigil-postgres
    environment:
      POSTGRES_DB: chainvigil_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Bind to loopback only — not exposed on the public interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chainvigil-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chainvigil_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chainvigil-redis
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes"]
    # Bind to loopback only — not exposed on the public interface.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - chainvigil-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chainvigil-postgres-data:
  chainvigil-redis-data:
